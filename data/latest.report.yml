{"id":437764563,"author":{"login":"QuentinFuxa","id":38427957,"node_id":"MDQ6VXNlcjM4NDI3OTU3","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDONfvYSs4aF8HT","tag_name":"v0.2.27","target_commitish":"ada82d4dc47f1b9d55dca31207829c77c2136a8f","name":"v0.2.27","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-07T18:35:59Z","updated_at":"2026-11-07T18:36:08Z","published_at":"2026-11-07T18:36:08Z","assets":[],"body":"Local MLX translation, bounded WebSocket sessions, and a security refresh of the locked dependencies.\n\n## Added\n- Local sentence translation on Apple Silicon through mlx-lm (`mlx-llm-mt` extra: Hunyuan-MT, TranslateGemma), with shared model weights and per-session languages and buffers. (#422, thanks @clkao)\n- Simultaneous MLX translation with calibrated attention (AlignAtt commit policy), and the zh→en calibration for Hy-MT2 1.8B 8bit. (#423, #448, thanks @clkao)\n- Per-session decoder context: a `context` query option on the native and Deepgram-compatible WebSockets, and the OpenAI-compatible REST `prompt` field now conditions the decoder. (#424)\n- `--max-concurrent-sessions` (64 per worker by default) and `--session-idle-timeout` (60 s by default) for WebSocket sessions. Upgrades beyond the limit are refused with HTTP 403 before any decoder or FFmpeg process is created. (#465)\n\n## Fixed\n- Sortformer inference no longer blocks the event loop. (#461, thanks @guhyun9454)\n- SimulStreaming reads the no-speech probability at the start-of-transcript token once the context buffer holds text. (#468, fixes #467 reported by @AuCourDe)\n- Closing a translation no longer waits behind the inference it needs to interrupt. (#445)\n- Final ASR output is no longer lost at the end of a stream, and decoder and diarization failures are reported to clients. (#440, #441)\n- Sessions requesting another language on non-Whisper backends no longer fail at construction. (#439)\n- Streaming queues are bounded, FFmpeg processes are reaped on disconnect, and failed requests no longer leave collector tasks running. (#432, #435)\n\n## Maintenance and security\n- Locked dependencies refreshed with the October security fixes (certifi, urllib3, filelock, fsspec, msgpack, Pillow, PyJWT, aiohttp and others), plus AnyIO and HTTPX2. Remaining blocked upgrades are listed in `docs/dependency-audit.md`. (#466, #472)\n- Checkpoint loading is restricted to weights-only tensors. (#438)\n- The `qwen3-vllm-metal` extra no longer pins the vllm-metal GitHub wheel, which was blocking Dependabot. Install vllm-metal with its official installer, then install the extra into that environment. (#473)\n- Transport security documented for remote AlignAtt translation servers. (#469)\n- Audio input and translation are separated from session orchestration. (#436)\n- Benchmark reports are reproducible, keep failures, and pace audio without artificial EOF delays. (#437, #442, #443)\n- CI, Docker and dependency updates. (#429, #430, #433, #457, #458, #470, #471)\n\n## New contributors\n- @clkao made their first contribution in #422.\n- @guhyun9454 made their first contribution in #461.\n\n**Full changelog**: https://github.com/QuentinFuxa/WhisperLiveKit/compare/v0.2.26...v0.2.27\n","mentions_count":3}
